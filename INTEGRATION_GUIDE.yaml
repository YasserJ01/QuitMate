# ─── pubspec.yaml additions ────────────────────────────────────────────────────
# Add these to your existing pubspec.yaml dependencies block.
# REMOVE: firebase_messaging (no longer needed — fully offline)

dependencies:
  flutter_local_notifications: ^17.2.2   # local scheduling, works offline
  timezone: ^0.9.4                        # required by flutter_local_notifications
  intl: ^0.19.0                           # date formatting in history screen

# ─── Android setup ──────────────────────────────────────────────────────────────
# android/app/src/main/AndroidManifest.xml  — add inside <manifest>:
#
#   <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
#   <uses-permission android:name="android.permission.VIBRATE"/>
#   <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
#   <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>   <!-- API 31+ -->
#   <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
#
# Inside <application>:
#   <receiver android:exported="false"
#     android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver">
#     <intent-filter>
#       <action android:name="android.intent.action.BOOT_COMPLETED"/>
#       <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
#     </intent-filter>
#   </receiver>
#   <receiver android:exported="false"
#     android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
#     <intent-filter>
#       <action android:name="android.intent.action.BOOT_COMPLETED"/>
#     </intent-filter>
#   </receiver>

# ─── iOS setup ─────────────────────────────────────────────────────────────────
# ios/Runner/AppDelegate.swift — no special changes needed beyond the plugin.
# Capabilities: Background Modes > "Background fetch" (optional for inactivity check).

